[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gopherllm"
version = "0.1.0"
description = "Python bindings for GopherLLM, a pure-Go GGUF inference engine, over its C ABI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Simon Waldherr" }]

[project.urls]
Homepage = "https://github.com/SimonWaldherr/GopherLLM"

[tool.setuptools.packages.find]
include = ["gopherllm*"]
