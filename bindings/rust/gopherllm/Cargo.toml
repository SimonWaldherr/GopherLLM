[package]
name = "gopherllm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe Rust bindings for GopherLLM, a pure-Go GGUF inference engine, over its C ABI (bindings/c/shim)."
repository = "https://github.com/SimonWaldherr/GopherLLM"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[[example]]
name = "generate"
path = "examples/generate.rs"
