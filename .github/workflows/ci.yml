name: CI

on:
  push:
  pull_request:

jobs:
  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and browser behavior
        run: |
          node --check server/web_ui/script.js
          node --check server/web_ui/vision.js
          node --check cmd/csv-workbench/web/app.js
          node --test server/web_ui/*test.cjs cmd/csv-workbench/frontend.test.cjs

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Test Core ML contracts
        run: go test -tags coreml ./...

      - name: Test and vet native Apple backends
        if: runner.os == 'macOS'
        run: |
          go test -tags 'metal coreml' ./...
          go vet -tags 'metal coreml' ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  coreml-exporters:
    name: Core ML exporter contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test without Core ML dependencies
        run: python -m unittest discover -s scripts -p 'test_export_coreml*.py'

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all release targets
        run: make cross-build

  no-image-decoders:
    # The noimagedecoders tag drops image/png and image/jpeg (and with them
    # compress/zlib, compress/flate, hash/adler32 and hash/crc32) from the
    # inference library's dependency closure. Nothing in the default build
    # exercises that configuration, so without this job it would rot silently:
    # the first untagged import of either decoder makes the tag a no-op, and
    # the first compile error behind it goes unnoticed until someone tries the
    # build. TestImageDecodersAreDroppable catches the former, this job the
    # latter.
    name: Build without image decoders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -tags noimagedecoders ./...

      - name: Vet
        run: go vet -tags noimagedecoders ./...

      - name: Test
        run: go test -tags noimagedecoders ./...

  wasm-build:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the browser wasm module
        run: make wasm-build

  c-abi:
    # bindings/c/test drives the C ABI end to end through the static library
    # the XCFramework is made of, against a synthetic model.
    name: C ABI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: End-to-end C ABI test
        run: make capi-test

  apple:
    name: Apple (XCFramework, Swift package, iOS demo)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: End-to-end C ABI test
        run: make capi-test

      - name: Build the XCFramework
        run: make xcframework

      - name: Swift package tests (macOS)
        run: make swift-test

      - name: Build the iOS demo for simulator and device
        run: make ios-demo-build
