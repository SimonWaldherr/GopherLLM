<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hestia</title>
  <link rel="stylesheet" href="/hestia.css">
  <script src="/hestia.js" defer></script>
</head>
<body>
  <main>
    <h1>Hestia</h1>
    <form id="command">
      <label for="text">Auftrag</label>
      <div class="actions">
        <input id="text" name="text" type="text" placeholder="Schalte die Stehlampe im Wohnzimmer ein" autocomplete="off" required autofocus>
        <button id="send" type="submit">Senden</button>
      </div>
    </form>
    <section class="voice" aria-label="Sprache">
      <div class="actions">
        <button id="mic" type="button" disabled>Aufnehmen</button>
        <button id="cancelMic" type="button" hidden>Abbrechen</button>
        <button id="listen" type="button" disabled aria-pressed="false">Zuhören aktivieren</button>
      </div>
      <p id="micStatus" role="status">Sprachfunktionen werden geprüft…</p>
      <p id="listenHelp" class="hint" hidden></p>
      <label id="speechLabel" hidden><input id="speak" type="checkbox" autocomplete="off"> Antworten mit einer lokalen Stimme vorlesen</label>
    </section>
    <p id="searchHelp" class="hint" hidden></p>
    <p id="error" role="alert" hidden></p>
    <section id="turns" aria-label="Verlauf"></section>
  </main>
</body>
</html>
